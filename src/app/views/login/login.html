<!-- 🧠 Toast de notificación -->
<div
  class="toast-container position-fixed top-0 end-0 p-3"
  style="z-index: 1200"
>
  <div
    *ngIf="toastMessage"
    class="toast align-items-center text-bg-{{ toastType }} border-0 show"
    role="alert"
    aria-live="assertive"
    aria-atomic="true"
  >
    <div class="d-flex">
      <div class="toast-body">{{ toastMessage }}</div>
      <button
        type="button"
        class="btn-close btn-close-white me-2 m-auto"
        (click)="closeToast()"
      ></button>
    </div>
  </div>
</div>

<div class="container d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow p-4" style="width: 22rem;">
    <h3 class="text-center mb-4">
      {{ step === 'login' ? 'Iniciar sesión' : 'Verificar código' }}
    </h3>

    <form (ngSubmit)="onSubmit()">
      <!-- Paso 1: Enviar correo -->
      <div *ngIf="step === 'login'">
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            id="email"
            type="email"
            class="form-control"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="loading"
          />
        </div>
      </div>

      <!-- Paso 2: Verificar código -->
      <div *ngIf="step === 'verify'">
        <div class="mb-3">
          <label for="code" class="form-label">Código de verificación</label>
          <input
            id="code"
            type="text"
            class="form-control"
            [(ngModel)]="code"
            name="code"
            required
            [disabled]="loading"
          />
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
          <button
            type="button"
            class="btn btn-outline-secondary btn-sm"
            (click)="goBack()"
            [disabled]="loading"
          >
            ← Volver
          </button>

          <div>
            <span *ngIf="countdown > 0" class="text-muted small">
              Reenviar en {{ countdown }}s
            </span>
            <button
              *ngIf="countdown === 0"
              type="button"
              class="btn btn-link p-0 small"
              (click)="resendCode()"
            >
              Reenviar código
            </button>
          </div>
        </div>
      </div>

      <button class="btn btn-primary w-100" type="submit" [disabled]="loading">
        <span *ngIf="!loading">
          {{ step === 'login' ? 'Enviar código' : 'Verificar' }}
        </span>
        <span
          *ngIf="loading"
          class="spinner-border spinner-border-sm"
          role="status"
          aria-hidden="true"
        ></span>
      </button>
    </form>
  </div>
</div>
